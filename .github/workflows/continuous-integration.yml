name: Continuous Integration
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  Linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uses Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Run Prettier
        run: bun pretty

  Building:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Uses Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run db:generate
      - name: TypeCheck
        run: bun run typecheck

  Tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run db:generate
      - name: Run Tests with coverage
        run: bun run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: bot-coverage
          path: coverage/lcov.info
          if-no-files-found: error

  Website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install website dependencies
        run: bun install --frozen-lockfile
      - name: Lint website
        run: bun run lint
      - name: Build website
        run: bun run build
      - name: Check website types
        run: bun run typecheck
      - name: Install browser
        run: bunx playwright install --with-deps chromium
      - name: Check desktop and mobile behavior
        run: bun run test:e2e
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: website-browser-results
          path: web/test-results/
          if-no-files-found: ignore

  MongoTests:
    name: MongoDB integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma Client
        run: bun run db:generate
      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name radon-test-mongo --publish 127.0.0.1:27028:27017 mongo:7 --replSet radonTest --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec radon-test-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1})' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec radon-test-mongo mongosh --quiet --eval 'rs.initiate({_id: "radonTest", members: [{_id: 0, host: "localhost:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec radon-test-mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          echo 'MongoDB replica set did not become writable.' >&2
          exit 1
      - name: Run tests against disposable local database
        env:
          RADON_TEST_MONGO_URL: mongodb://127.0.0.1:27028/radon_test_ci?directConnection=true&replicaSet=radonTest
          RADON_REDEMPTION_TEST_MONGO: mongodb://127.0.0.1:27028/radon_test_ci_redemption?directConnection=true&replicaSet=radonTest
          RADON_REWARDS_TEST_MONGO: mongodb://127.0.0.1:27028/radon_test_ci_rewards?directConnection=true&replicaSet=radonTest
          RADON_BUG_TEST_MONGO: mongodb://127.0.0.1:27028/radon_test_ci_bugs?directConnection=true&replicaSet=radonTest
          RADON_LOCK_TEST_MONGO: mongodb://127.0.0.1:27028/radon_test_ci_locks?directConnection=true&replicaSet=radonTest
        run: bun test
      - name: Remove disposable database
        if: always()
        run: docker rm --force radon-test-mongo || true
